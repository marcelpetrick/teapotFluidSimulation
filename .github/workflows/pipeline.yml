#
# Mirrors ./localPipeline.sh exactly, then deploys the built site to GitHub Pages
# from main so anyone can run PourLab in the browser.
name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Keep a running pipeline alive when a newer push arrives.
# The newest pending revision can deploy after that run finishes.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pipeline:
    name: Local pipeline replica
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Run local pipeline (format, lint, typecheck, coverage, build, e2e)
        run: ./localPipeline.sh

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright
          path: test-results
          if-no-files-found: ignore

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: pipeline
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
